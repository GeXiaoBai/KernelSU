          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./lkm-modules.zip
          asset_name: lkm-${{ github.event.inputs.release_tag }}.zip
          asset_content_type: application/zip          - android12-5.10
              - android13-5.10
              - android13-5.15
              - android14-5.15
              - android14-6.1
              - android15-6.6
              - android16-6.12
              - android17-6.18
    # 如果手动触发且指定了 specific_kmi，则只构建匹配的 KMI
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.specific_kmi == '' || github.event.inputs.specific_kmi == matrix.kmi
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      kmi: ${{ matrix.kmi }}
      expected_size2: ${{ inputs.expected_size2 || '' }}
      expected_hash2: ${{ inputs.expected_hash2 || '' }}

  # 新增打包并上传到 Release 的 job
  package-release:
    name: Package and upload to Release
    needs: build-lkm
    runs-on: ubuntu-latest
    # 仅当手动触发且提供了 release_tag 时才执行
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
    steps:
      - name: Download all artifacts from build-lkm
        uses: actions/download-artifact@v8
        with:
          path: ./all_artifacts

      - name: List downloaded artifacts
        run: ls -R ./all_artifacts

      - name: Create ZIP package
        run: |
          zip -r lkm-all.zip ./all_artifacts/*

      - name: Create Release (if not exists)
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          release_name: Release ${{ github.event.inputs.release_tag }}
          draft: false
          prerelease: false

      - name: Upload ZIP to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./lkm-all.zip
          asset_name: lkm-${{ github.event.inputs.release_tag }}.zip
          asset_content_type: application/zip
