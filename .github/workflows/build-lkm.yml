name: Build LKM for KernelSU

on:
  workflow_call:
    inputs:
      expected_size2:
        description: 'Second expected signature size (for PR builds)'
        required: false
        default: ''
        type: string
      expected_hash2:
        description: 'Second expected signature hash (for PR builds)'
        required: false
        default: ''
        type: string
  
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload assets (e.g., v1.0.0)'
        required: false
        default: ''
        type: string

jobs:
  build-lkm:
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      kmi: ${{ matrix.kmi }}
      expected_size2: ${{ inputs.expected_size2 || '' }}
      expected_hash2: ${{ inputs.expected_hash2 || '' }}

  upload-to-release:
    needs: build-lkm
    runs-on: ubuntu-latest
    # 只有手动触发且提供了 release_tag 才运行
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
    permissions:
      contents: write  # 关键：赋予写入权限
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          
      - name: Package LKM files
        run: |
          zip -r lkm-modules.zip ./artifacts/ || true
          
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          release_name: ${{ github.event.inputs.release_tag }}
          draft: false
          prerelease: false
          
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./lkm-modules.zip
          asset_name: lkm-${{ github.event.inputs.release_tag }}.zip
          asset_content_type: application/zip
