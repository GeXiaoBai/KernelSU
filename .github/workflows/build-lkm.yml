        type: string
  
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload assets (e.g., v1.0.0)'
        required: false
        default: ''
        type: string

jobs:
  build-lkm:
    strategy:
      matrix:
