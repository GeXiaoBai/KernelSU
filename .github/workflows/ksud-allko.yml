name: Build ksud with all LKM

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Rust target triple'
        required: true
        type: choice
        options:
          - aarch64-linux-android
          - x86_64-linux-android
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-apple-darwin
          - x86_64-apple-darwin
        default: aarch64-linux-android
      pack_ksuinit:
        description: 'Pack ksuinit'
        required: false
        type: boolean
        default: false

jobs:
  # ============ Job 1: 构建所有 LKM（调用现有工作流） ============
  build-lkm:
    name: Build LKM for ${{ matrix.kmi }}
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      kmi: ${{ matrix.kmi }}
      expected_size2: ''
      expected_hash2: ''

  # ============ Job 2: 下载所有 LKM 并打包 ============
  collect-lkm:
    name: Collect all LKM artifacts
    runs-on: ubuntu-latest
    needs: build-lkm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all LKM artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./lkm-artifacts

      - name: Organize LKM files by architecture
        run: |
          # 查看下载了什么
          ls -R ./lkm-artifacts
          
          # 创建 ksud 的 bin 目录
          mkdir -p ./userspace/ksud/bin/aarch64/
          mkdir -p ./userspace/ksud/bin/x86_64/
          
          # 查找所有 .ko 文件并复制
          find ./lkm-artifacts -name "*.ko" -type f -exec cp {} ./userspace/ksud/bin/aarch64/ \; 2>/dev/null || true
          find ./lkm-artifacts -name "*.ko" -type f -exec cp {} ./userspace/ksud/bin/x86_64/ \; 2>/dev/null || true
          
          echo "=== ARM64 LKM files ==="
          ls -la ./userspace/ksud/bin/aarch64/ || echo "No ARM64 LKM files"
          echo "=== x86_64 LKM files ==="
          ls -la ./userspace/ksud/bin/x86_64/ || echo "No x86_64 LKM files"

      - name: Upload organized LKM
        uses: actions/upload-artifact@v7
        with:
          name: organized-lkm
          path: ./userspace/ksud/bin/

  # ============ Job 3: 构建 ksud 并打包所有 LKM ============
  build-ksud:
    name: Build ksud with all LKM
    runs-on: ubuntu-latest
    needs: collect-lkm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download organized LKM
        uses: actions/download-artifact@v8
        with:
          name: organized-lkm
          path: ./userspace/ksud/bin/

      - name: Verify LKM files are in place
        run: |
          echo "=== LKM files in ksud/bin ==="
          ls -la ./userspace/ksud/bin/
          ls -la ./userspace/ksud/bin/aarch64/ || echo "No aarch64 directory"
          ls -la ./userspace/ksud/bin/x86_64/ || echo "No x86_64 directory"

      - name: Prepare ksuinit (optional)
        if: inputs.pack_ksuinit
        run: |
          mkdir -p ./userspace/ksud/bin/aarch64/
          mkdir -p ./userspace/ksud/bin/x86_64/
          # 如果 ksuinit 已经作为 artifact 存在
          if [ -d "./ksuinit-aarch64" ]; then
            cp ./ksuinit-aarch64/ksuinit ./userspace/ksud/bin/aarch64/
          fi
          if [ -d "./ksuinit-x86_64" ]; then
            cp ./ksuinit-x86_64/ksuinit ./userspace/ksud/bin/x86_64/
          fi

      - name: Setup rustup
        run: |
          rustup update stable
          rustup target add ${{ inputs.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: userspace/ksud
          cache-targets: false
          cache-bin: false

      - name: Install cross
        run: |
          RUSTFLAGS="" cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1

      - name: Assemble LKM bootstrap
        run: |
          clang --target=aarch64-linux-gnu -c -nostdlib \
            -o userspace/ksud/.lkm_image_bootstrap.o \
            userspace/ksud/src/lkm_image_bootstrap.S || true

      - name: Build ksud
        run: |
          CROSS_NO_WARNINGS=0 cross build --target ${{ inputs.target }} --release \
            --manifest-path ./userspace/ksud/Cargo.toml

      - name: Upload ksud with LKM
        uses: actions/upload-artifact@v7
        with:
          name: ksud-${{ inputs.target }}-with-lkm
          path: target/${{ inputs.target }}/release/ksud*

  # ============ Job 4: 打包并上传到 Release ============
  package-release:
    name: Package and upload to Release
    runs-on: ubuntu-latest
    needs: build-ksud
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download ksud artifact
        uses: actions/download-artifact@v8
        with:
          name: ksud-${{ inputs.target }}-with-lkm
          path: ./ksud-bin

      - name: Package binary
        run: |
          cd ./ksud-bin
          # 如果是 Android 目标，打包成 zip
          if [[ "${{ inputs.target }}" == *"android"* ]]; then
            zip -r ../ksud-${{ inputs.target }}.zip ./
          else
            tar -czf ../ksud-${{ inputs.target }}.tar.gz ./
          fi
          cd ..

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./ksud-${{ inputs.target }}.zip
          asset_name: ksud-${{ inputs.target }}-with-lkm.zip
          asset_content_type: application/zip
